name: Viewer tests

# Runs the catalogue viewer's tests on every pull request and push to main that touches the viewer.
# The tests read the fixed catalogue in visualizer/test/fixtures, so catalogue pull requests don't need them.
on:
  pull_request:
    paths:
      - 'visualizer/**'
      - '.github/workflows/viewer-tests.yml'
  push:
    branches: [main]
    paths:
      - 'visualizer/**'
      - '.github/workflows/viewer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, server and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visualizer/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit and server tests
        run: npm test

      - name: Install the test browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Browser tests
        run: npm run test:browser

      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: visualizer/test-results/
          retention-days: 7
