<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 518" width="984" height="518" role="img" aria-label="Azure resources for the viewer proof of concept. In Entra ID, the deploy app registration's federated credential trusts the atlas-dfe viewer environment, and its service principal has Contributor on the resource group. In the Development subscription, resource group atlas-viewer-poc-rg in UK South holds the Container Apps environment and its Container App, the managed identity the app pulls with (AcrPull on the registry), the Basic container registry and the Log Analytics workspace.">
<title>Azure resources for the viewer proof of concept. In Entra ID, the deploy app registration's federated credential trusts the atlas-dfe viewer environment, and its service principal has Contributor on the resource group. In the Development subscription, resource group atlas-viewer-poc-rg in UK South holds the Container Apps environment and its Container App, the managed identity the app pulls with (AcrPull on the registry), the Basic container registry and the Log Analytics workspace.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
.diamond { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="983" height="517" rx="12"/>
<defs>
  <marker id="h3-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h3-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h3-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="org" x="20" y="24" width="250" height="262" rx="10"/>
<text class="t-b" x="36" y="46">Entra ID</text>
<text class="t-m" x="254" y="46" text-anchor="end">tenant</text>
<rect class="box" x="36" y="62" width="218" height="58" rx="6"/>
<text class="t-b" x="52" y="83">App registration</text>
<text class="t-m" x="52" y="101">Atlas DfE viewer deploy</text>
<text class="t-m" x="52" y="115">(proof of concept)</text>
<rect class="key" x="36" y="136" width="218" height="58" rx="6"/>
<text class="t-b" x="52" y="157">Federated credential</text>
<text class="t-m" x="52" y="175">trusts atlas-dfe's viewer</text>
<text class="t-m" x="52" y="189">environment only</text>
<rect class="box-strong" x="36" y="210" width="218" height="58" rx="8"/>
<text class="t-b" x="52" y="234">Service principal</text>
<text class="t-m" x="52" y="254">the deploy identity</text>
<line class="ln" x1="145" y1="120" x2="145" y2="134" marker-end="url(#h3-fg)"/>
<line class="ln" x1="145" y1="194" x2="145" y2="208" marker-end="url(#h3-fg)"/>

<rect class="org" x="20" y="318" width="250" height="176" rx="10"/>
<text class="t-b" x="36" y="340">GitHub</text>
<text class="t-mono t-m" x="254" y="340" text-anchor="end">atlas-dfe</text>
<rect class="box" x="36" y="356" width="218" height="52" rx="6"/>
<text class="t-b" x="52" y="377">viewer environment</text>
<text class="t-m" x="52" y="395">3 secrets · 3 variables</text>
<rect class="box" x="36" y="424" width="218" height="52" rx="6"/>
<text class="t-b" x="52" y="445">Deploy catalogue viewer</text>
<text class="t-m" x="52" y="463">workflow · runs on push to main</text>
<line class="ln" x1="145" y1="424" x2="145" y2="410" marker-end="url(#h3-fg)"/>
<path class="ln" d="M36 382 H28 V165 H34" marker-end="url(#h3-fg)"/>
<text class="t-m" x="40" y="306">OIDC sign-in</text>

<rect class="org" x="310" y="24" width="650" height="470" rx="10"/>
<text class="t-b" x="326" y="46">Subscription · Development</text>

<rect class="group" x="326" y="62" width="618" height="416" rx="10"/>
<text class="t-mono t-b" x="342" y="84">atlas-viewer-poc-rg</text>
<text class="t-m" x="928" y="84" text-anchor="end">UK South · tags Owner, Purpose</text>

<rect class="box" x="346" y="104" width="306" height="236" rx="8"/>
<text class="t-b" x="362" y="126">Container Apps environment</text>
<text class="t-mono t-m" x="362" y="144">atlas-dfe-viewer-env</text>
<text class="t-m" x="362" y="162">Consumption profile · no VNet</text>

<rect class="box-strong" x="362" y="178" width="274" height="136" rx="8"/>
<text class="t-b" x="378" y="202">Container App</text>
<text class="t-mono" x="378" y="222">atlas-dfe-viewer</text>
<text class="t-m" x="378" y="244">0.25 vCPU · 0.5 GiB · 0–2 replicas</text>
<text class="t-m" x="378" y="262">external HTTPS ingress · no plain HTTP</text>
<text class="t-m" x="378" y="280">single revision · HTTP Basic login</text>
<text class="t-m" x="378" y="298">secret auth-password</text>


<rect class="box" x="704" y="104" width="224" height="64" rx="6"/>
<text class="t-b" x="720" y="125">Managed identity</text>
<text class="t-mono t-m" x="720" y="143">atlas-dfe-viewer-pull</text>
<text class="t-m" x="720" y="159">user-assigned</text>

<rect class="box" x="704" y="216" width="224" height="82" rx="6"/>
<text class="t-b" x="720" y="237">Container registry</text>
<text class="t-mono t-m" x="720" y="255">atlasdfeviewerpoc</text>
<text class="t-m" x="720" y="273">Basic · admin user off</text>
<text class="t-m" x="720" y="289">repository atlas-viewer</text>

<rect class="box" x="704" y="322" width="224" height="64" rx="6"/>
<text class="t-b" x="720" y="343">Log Analytics workspace</text>
<text class="t-mono t-m" x="720" y="361">atlas-dfe-viewer-logs</text>
<text class="t-m" x="720" y="377">PerGB2018 · 30 days</text>

<path class="ln" d="M636 196 H670 V136 H702" marker-end="url(#h3-fg)"/>
<text class="t-m" x="642" y="128">pulls as</text>
<line class="ln-read" x1="816" y1="168" x2="816" y2="214" marker-end="url(#h3-read)"/>
<text class="t-read" x="826" y="196">AcrPull</text>
<path class="ln" d="M652 330 H676 V354 H702" marker-end="url(#h3-fg)"/>
<text class="t-m" x="656" y="322">logs</text>

<path class="ln-write" d="M254 239 H324" marker-end="url(#h3-write)"/>
<text class="t-write" x="262" y="231">Contributor</text>
<text class="t-m" x="346" y="420">The deploy identity's only role: Contributor on this resource group.</text>
<text class="t-m" x="346" y="438">The pull identity's only role: AcrPull on the registry.</text>
<text class="t-m" x="346" y="456">No registry passwords or Azure credentials are stored anywhere.</text>
</svg>
