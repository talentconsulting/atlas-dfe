<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 434" width="984" height="434" role="img" aria-label="Hosting: people reach the Container App over HTTPS only and sign in with its username and password. Inside one resource group, the app runs in a Container Apps environment, reads its password from a Container App secret, pulls its image from a private registry with a managed identity that has AcrPull, and sends logs to Log Analytics. The deploy workflow pushes new images to the registry.">
<title>Hosting: people reach the Container App over HTTPS only and sign in with its username and password. Inside one resource group, the app runs in a Container Apps environment, reads its password from a Container App secret, pulls its image from a private registry with a managed identity that has AcrPull, and sends logs to Log Analytics. The deploy workflow pushes new images to the registry.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
.diamond { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="983" height="433" rx="12"/>
<defs>
  <marker id="h1-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h1-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h1-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="box-strong" x="20" y="150" width="170" height="64" rx="8"/>
<text class="t-b" x="36" y="174">People using it</text>
<text class="t-m" x="36" y="194">browser · username</text>
<text class="t-m" x="36" y="208">and password</text>

<rect class="box-strong" x="20" y="300" width="170" height="58" rx="8"/>
<text class="t-b" x="36" y="324">GitHub Actions</text>
<text class="t-m" x="36" y="344">Deploy catalogue viewer</text>

<rect class="org" x="250" y="24" width="690" height="362" rx="10"/>
<text class="t-b" x="266" y="46">Resource group</text>
<text class="t-m" x="924" y="46" text-anchor="end">created by infra/viewer.bicep</text>

<rect class="group" x="270" y="66" width="340" height="300" rx="10"/>
<text class="t-b" x="286" y="88">Container Apps environment</text>
<text class="t-mono t-m" x="286" y="106">&lt;namePrefix&gt;-env</text>
<path class="ln" d="M190 182 H288" marker-end="url(#h1-fg)"/>
<text class="t-m" x="200" y="174">HTTPS only</text>

<rect class="box-strong" x="290" y="126" width="300" height="92" rx="8"/>
<text class="t-b" x="306" y="150">Container App</text>
<text class="t-mono" x="306" y="170">&lt;namePrefix&gt;</text>
<text class="t-m" x="306" y="190">viewer and catalogue in one image</text>
<text class="t-m" x="306" y="208">HTTP Basic login · scales to zero</text>

<rect class="key" x="290" y="250" width="300" height="50" rx="6"/>
<text class="t-b" x="306" y="271">auth-password secret</text>
<text class="t-m" x="306" y="289">passed to the app as AUTH_PASSWORD</text>
<line class="ln" x1="440" y1="250" x2="440" y2="220" marker-end="url(#h1-fg)"/>

<text class="t-m" x="290" y="330">Plain HTTP is refused, so the password</text>
<text class="t-m" x="290" y="348">is never sent unencrypted.</text>

<rect class="box" x="660" y="126" width="260" height="50" rx="6"/>
<text class="t-b" x="676" y="147">Managed identity</text>
<text class="t-mono t-m" x="676" y="165">&lt;namePrefix&gt;-pull</text>
<path class="ln" d="M590 151 H658" marker-end="url(#h1-fg)"/>
<text class="t-m" x="600" y="143">pulls as</text>

<rect class="box" x="660" y="220" width="260" height="64" rx="6"/>
<text class="t-b" x="676" y="241">Container registry</text>
<text class="t-mono t-m" x="676" y="259">&lt;registryName&gt;</text>
<text class="t-m" x="676" y="276">private · admin user off</text>
<line class="ln-read" x1="790" y1="176" x2="790" y2="218" marker-end="url(#h1-read)"/>
<text class="t-read" x="800" y="202">AcrPull</text>

<rect class="box" x="660" y="316" width="260" height="50" rx="6"/>
<text class="t-b" x="676" y="337">Log Analytics</text>
<text class="t-mono t-m" x="676" y="355">&lt;namePrefix&gt;-logs</text>
<path class="ln" d="M610 341 H658" marker-end="url(#h1-fg)"/>
<text class="t-m" x="616" y="333">logs</text>

<path class="ln-write" d="M105 358 V404 H956 V252 H922" marker-end="url(#h1-write)"/>
<text class="t-write" x="600" y="398" text-anchor="middle">pushes a new image on every push to main</text>
</svg>
