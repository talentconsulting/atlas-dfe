<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 404" width="984" height="404" role="img" aria-label="Deploying: every push to main in atlas-dfe, including each merged catalogue pull request, runs Deploy catalogue viewer in the viewer environment. It signs in to Azure with OIDC as the deploy identity, which has Contributor on the resource group only, builds the image in the registry, and updates the Container App, which pulls the new image with its managed identity.">
<title>Deploying: every push to main in atlas-dfe, including each merged catalogue pull request, runs Deploy catalogue viewer in the viewer environment. It signs in to Azure with OIDC as the deploy identity, which has Contributor on the resource group only, builds the image in the registry, and updates the Container App, which pulls the new image with its managed identity.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
.diamond { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="983" height="403" rx="12"/>
<defs>
  <marker id="h2-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h2-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="h2-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="box-strong" x="20" y="64" width="200" height="58" rx="8"/>
<text class="t-mono t-b" x="36" y="88">atlas-dfe · main</text>
<text class="t-m" x="36" y="108">every merged pull request</text>

<rect class="group" x="270" y="14" width="340" height="366" rx="10"/>
<text class="t-b" x="286" y="36">Deploy catalogue viewer</text>
<text class="t-m" x="286" y="54">GitHub Actions · viewer environment</text>
<path class="ln" d="M220 92 H288" marker-end="url(#h2-fg)"/>
<text class="t-m" x="232" y="84">push</text>

<rect class="box" x="290" y="70" width="300" height="44" rx="6"/>
<text class="t-b" x="306" y="89">1 · Sign in to Azure</text>
<text class="t-m" x="306" y="106">OIDC, no stored Azure credentials</text>
<line class="ln" x1="440" y1="114" x2="440" y2="138" marker-end="url(#h2-fg)"/>

<rect class="box" x="290" y="140" width="300" height="44" rx="6"/>
<text class="t-b" x="306" y="159">2 · Build the image</text>
<text class="t-m" x="306" y="176">az acr build · tagged with the commit</text>
<line class="ln" x1="440" y1="184" x2="440" y2="208" marker-end="url(#h2-fg)"/>

<rect class="box" x="290" y="210" width="300" height="44" rx="6"/>
<text class="t-b" x="306" y="229">3 · Connect the app to the registry</text>
<text class="t-m" x="306" y="246">pull with its managed identity</text>
<line class="ln" x1="440" y1="254" x2="440" y2="278" marker-end="url(#h2-fg)"/>

<rect class="box" x="290" y="280" width="300" height="44" rx="6"/>
<text class="t-b" x="306" y="299">4 · Deploy the new image</text>
<text class="t-m" x="306" y="316">new revision · address in run summary</text>

<text class="t-m" x="290" y="354">A newer push cancels a run in progress.</text>

<rect class="key" x="660" y="54" width="280" height="76" rx="6"/>
<text class="t-b" x="676" y="76">Entra ID deploy identity</text>
<text class="t-m" x="676" y="96">trusts …:environment:viewer only</text>
<text class="t-m" x="676" y="114">Contributor on the resource group</text>
<line class="ln" x1="590" y1="92" x2="658" y2="92" marker-start="url(#h2-fg)" marker-end="url(#h2-fg)"/>
<text class="t-m" x="600" y="84">token</text>

<rect class="org" x="660" y="150" width="280" height="230" rx="10"/>
<text class="t-b" x="676" y="172">Resource group</text>

<rect class="box" x="680" y="186" width="240" height="50" rx="6"/>
<text class="t-b" x="696" y="207">Container registry</text>
<text class="t-mono t-m" x="696" y="225">atlas-viewer:&lt;commit&gt;</text>
<path class="ln-write" d="M590 162 H630 V211 H678" marker-end="url(#h2-write)"/>
<text class="t-write" x="600" y="154">builds</text>

<rect class="box-strong" x="680" y="280" width="240" height="58" rx="8"/>
<text class="t-b" x="696" y="304">Container App</text>
<text class="t-m" x="696" y="324">runs the new revision</text>
<path class="ln-write" d="M590 302 H678" marker-end="url(#h2-write)"/>
<text class="t-write" x="600" y="294">updates</text>
<line class="ln-read" x1="800" y1="278" x2="800" y2="238" marker-end="url(#h2-read)"/>
<text class="t-read" x="810" y="262">pulls image</text>
</svg>
